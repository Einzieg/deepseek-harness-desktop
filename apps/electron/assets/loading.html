<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Harness</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #17233c;
        background:
          radial-gradient(circle at 50% 28%, rgb(54 108 255 / 14%), transparent 34rem),
          #f4f7fb;
        font: 15px/1.5 Inter, "Segoe UI", sans-serif;
      }
      main { display: grid; justify-items: center; gap: 18px; }
      img { width: 58px; height: 58px; }
      h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.02em; }
      p { margin: -8px 0 0; color: #65728a; }
      .progress {
        width: 180px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(53 91 163 / 14%);
      }
      .progress::after {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: #315efb;
        animation: loading 1.1s ease-in-out infinite alternate;
      }
      @keyframes loading { from { transform: translateX(-5%); } to { transform: translateX(145%); } }
      @media (prefers-color-scheme: dark) {
        body {
          color: #f3f6ff;
          background: radial-gradient(circle at 50% 28%, rgb(91 130 255 / 18%), transparent 34rem), #111722;
        }
        p { color: #9ca8bd; }
        img { filter: invert(1); }
      }
      @media (prefers-reduced-motion: reduce) { .progress::after { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.svg" alt="">
      <h1>DeepSeek Harness</h1>
      <p>Starting the local workspace…</p>
      <div class="progress" role="progressbar" aria-label="Starting"></div>
    </main>
  </body>
</html>
